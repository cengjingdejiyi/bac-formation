[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacmarl"
version = "0.1.0"
description = "带宽受限下多无人机分布式编队通信学习（BAC-MAPPO）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
    "torch>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.1"]
env = ["mpe2>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]
