name: ci

# 对应开题报告附录 A.8：合并前 tests 必过
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 CPU 版 torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 安装项目与真实环境依赖（同时验证可编辑安装）
        run: python -m pip install -e ".[dev,env]"

      - name: 契约冒烟（不依赖 mpe2，走 mock 后端）
        run: python scripts/smoke.py

      - name: 形状、通信语义与转移缓存测试
        run: python -m pytest -q tests

      - name: 标准模块入口训练冒烟（真实 MPE2，跨 rollout 与回合边界）
        run: >-
          python -m bacmarl.runners.train env=formation algo=bac
          train.total_env_steps=32 train.n_envs=2 train.rollout_len=4
          train.ppo_epochs=1 train.minibatch=8 train.hidden=16
          env.max_steps=6 experiment.name=ci seed=0
