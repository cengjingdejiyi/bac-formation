# 主实验（负责人 E）
train:
  total_env_steps: 200000
  n_envs: 8
  rollout_len: 64
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  norm_adv: true           # 优势在整轮更新上归一化（不是逐小批量）
  reward_norm: false       # 实测 scale() 只缩小不放大、每步奖励 std<1 → 恒为 1.0，本任务等价关闭
  value_norm: true         # 价值回归目标按回合回报 std 缩放（O(1) 量级）；200k A/B 已验证；与 reward_norm 互斥
  value_clip_eps: null     # 可选：价值目标相对 v_old 的裁断；配 reward_norm 才合适，留空即关闭
  entropy_coef: 0.01
  ppo_epochs: 4
  minibatch: 1024
  hidden: 64
  eval_every: 10000        # 每多少 env_steps 跑一次确定性评测并存周期 ckpt
  eval_episodes: 8
  eval_gate_mode: threshold  # threshold（p>=0.5，历史口径）| sample（与训练分布同口径，预算比较用它）
  # eval_drop_p / eval_flip_p 省略时取 env.channel 训练采样区间的中点
