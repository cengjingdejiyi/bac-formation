# 主方法：BAC-MAPPO（负责人 A）
algo:
  name: bac
  comm: bac                # none | ic3net | tarmac | bac
  critic: central          # central | local
  msg_dim: 8               # 连续消息维度（仅 ic3net/tarmac 用）
  msg_bits: 4              # L：BAC 每条消息比特数
  budget_bits: 2.0         # b_max：每机每步允许的平均比特数
  beta_init: 0.1           # β 初值
  beta_lr: 0.05            # β 对偶步长
  beta_max: 5.0            # β 上界：预算极紧时防止对偶变量发散
  aggregate: softmax       # softmax（默认）| mean（消融 mean_agg：均匀平均）
  use_gate: true           # false 即消融 no_gate：不建门控头，bits 恒为 L
